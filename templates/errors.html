{% extends "base.html" %}
{% block title %}{{ code }}{% endblock %}
{% block content %}
<div class="min-h-[60vh] grid place-items-center text-center">
  <div>
    <p class="text-6xl font-extrabold text-royal-500">{{ code }}</p>
    <p class="mt-3 text-lg font-semibold text-slate-900">{{ message }}</p>
    <a href="{{ url_for('dashboard.home') if current_user.is_authenticated else url_for('auth.login') }}"
       class="mt-5 inline-block px-5 py-2.5 rounded-xl bg-royal-500 hover:bg-royal-600 text-white text-sm font-semibold">
      Go back home
    </a>
  </div>
</div>
{% endblock %}
